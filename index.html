<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        color: #4a2635;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #ffeaf2, #ffd1e3);
      }
      header {
        padding: 35px 20px;
        color: white;
        text-align: center;
        background: linear-gradient(135deg, #ff4f8b, #ff78a8);
        box-shadow: 0 5px 20px rgba(255, 70, 130, 0.25);
      }
      header h1 {
        margin-bottom: 8px;
        font-size: 34px;
        letter-spacing: 1px;
      }
      main {
        width: 92%;
        max-width: 1100px;
        margin: 35px auto;
      }
      .days {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
      }
      button {
        cursor: pointer;
        font: inherit;
      }
      .day-btn,
      .pdf-btn {
        border: 0;
        border-radius: 25px;
        color: white;
        font-weight: 600;
      }
      .day-btn {
        padding: 12px 22px;
        border: 2px solid #ff8fb6;
        color: #d6336c;
        background: rgba(255, 255, 255, 0.9);
      }
      .day-btn.active,
      .day-btn:hover {
        color: white;
        background: #ff4f8b;
      }
      .pdf-btn {
        display: block;
        margin: 0 auto 30px;
        padding: 13px 24px;
        background: #d6336c;
      }
      #selectedDay {
        margin-bottom: 25px;
        color: #d6336c;
        text-align: center;
        font-size: 28px;
      }
      .subjects {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .subject {
        padding: 22px;
        border: 1px solid #ffd0df;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 25px rgba(214, 51, 108, 0.12);
      }
      .subject h3 {
        margin-bottom: 18px;
        padding-bottom: 12px;
        color: #c72f65;
        border-bottom: 2px solid #ffe0ea;
      }
      .subject input {
        width: 100%;
        margin: 15px 0 10px;
        padding: 13px 14px;
        border: 2px solid #ffd0df;
        border-radius: 10px;
        outline: none;
      }
      .subject > button {
        width: 100%;
        padding: 11px 15px;
        border: 0;
        border-radius: 10px;
        color: white;
        background: #ff4f8b;
        font-weight: 600;
      }
      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 9px;
        padding: 11px 12px;
        border-radius: 10px;
        background: #fff0f5;
      }
      .task span {
        flex: 1;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .completed {
        color: #b58b9a;
        text-decoration: line-through;
        opacity: 0.7;
      }
      .delete {
        padding: 6px 10px;
        border: 0;
        border-radius: 7px;
        color: white;
        background: #ff5c73;
      }
      .empty {
        padding: 10px 0;
        color: #d09aaa;
        text-align: center;
        font-size: 13px;
      }
      @media (max-width: 800px) {
        .subjects {
          grid-template-columns: 1fr;
        }
        header h1 {
          font-size: 27px;
        }
      }
      @media (max-width: 450px) {
        .day-btn {
          flex: 1 1 30%;
          padding: 10px 15px;
          font-size: 13px;
        }
      }
      @media print {
        @page {
          margin: 16mm;
        }
        body {
          min-height: auto;
          background: white;
        }
        header {
          color: #4a2635;
          background: white;
          box-shadow: none;
        }
        .days,
        .pdf-btn,
        .subject input,
        .subject > button,
        .delete {
          display: none;
        }
        main {
          width: 100%;
          max-width: none;
          margin: 0;
        }
        .subjects {
          grid-template-columns: repeat(3, 1fr);
          gap: 12px;
        }
        .subject {
          padding: 14px;
          box-shadow: none;
        }
        .task {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MAHI PLANNER</h1>
      <p>Plan your study day by day</p>
    </header>
    <main>
      <div class="days" id="days"></div>
      <button class="pdf-btn" id="downloadButton" type="button">
        Download Weekly Planner
      </button>
      <h2 id="selectedDay">Monday</h2>
      <div class="subjects">
        <section class="subject" data-subject="Chemistry">
          <h3>Chemistry</h3>
          <div class="tasks"></div>
          <input type="text" placeholder="What do you want to study?" /><button
            type="button"
          >
            + Add Task
          </button>
        </section>
        <section class="subject" data-subject="Physics">
          <h3>Physics</h3>
          <div class="tasks"></div>
          <input type="text" placeholder="What do you want to study?" /><button
            type="button"
          >
            + Add Task
          </button>
        </section>
        <section class="subject" data-subject="Maths">
          <h3>Maths</h3>
          <div class="tasks"></div>
          <input type="text" placeholder="What do you want to study?" /><button
            type="button"
          >
            + Add Task
          </button>
        </section>
      </div>
    </main>
    <script>
      const days = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",
      ];
      let selectedDay = "Monday";
      let studyPlan = JSON.parse(localStorage.getItem("studyPlan") || "{}");
      function savePlan() {
        localStorage.setItem("studyPlan", JSON.stringify(studyPlan));
      }
      function displayTasks() {
        document.getElementById("selectedDay").textContent = selectedDay;
        document
          .querySelectorAll(".day-btn")
          .forEach((button) =>
            button.classList.toggle(
              "active",
              button.dataset.day === selectedDay,
            ),
          );
        document.querySelectorAll(".subject").forEach((card) => {
          const container = card.querySelector(".tasks");
          const subject = card.dataset.subject;
          container.replaceChildren();
          const tasks = studyPlan[selectedDay]?.[subject] || [];
          if (!tasks.length) {
            container.innerHTML = '<p class="empty">No tasks yet</p>';
            return;
          }
          tasks.forEach((task, index) => {
            const row = document.createElement("div");
            row.className = "task";
            const text = document.createElement("span");
            text.textContent = task.text;
            text.classList.toggle("completed", task.completed);
            text.addEventListener("click", () => {
              task.completed = !task.completed;
              savePlan();
              displayTasks();
            });
            const remove = document.createElement("button");
            remove.className = "delete";
            remove.type = "button";
            remove.textContent = "Delete";
            remove.addEventListener("click", () => {
              studyPlan[selectedDay][subject].splice(index, 1);
              savePlan();
              displayTasks();
            });
            row.append(text, remove);
            container.appendChild(row);
          });
        });
      }
      function addTask(subject, input) {
        const task = input.value.trim();
        if (!task) return;
        studyPlan[selectedDay] ||= {};
        studyPlan[selectedDay][subject] ||= [];
        studyPlan[selectedDay][subject].push({ text: task, completed: false });
        input.value = "";
        savePlan();
        displayTasks();
      }
      days.forEach((day) => {
        const button = document.createElement("button");
        button.className = "day-btn";
        button.type = "button";
        button.dataset.day = day;
        button.textContent = day;
        button.addEventListener("click", () => {
          selectedDay = day;
          displayTasks();
        });
        document.getElementById("days").appendChild(button);
      });
      document.querySelectorAll(".subject").forEach((card) => {
        const input = card.querySelector("input");
        card
          .querySelector("button")
          .addEventListener("click", () =>
            addTask(card.dataset.subject, input),
          );
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") addTask(card.dataset.subject, input);
        });
      });
      document
        .getElementById("downloadButton")
        .addEventListener("click", () => {
          const originalTitle = document.title;
          document.title = `${selectedDay} Study Planner`;
          window.print();
          document.title = originalTitle;
        });
      displayTasks();
    </script>
  </body>
</html>
